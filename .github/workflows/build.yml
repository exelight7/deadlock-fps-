name: Test, build and release desktop apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller==6.20.0
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
      - name: Unit and interface tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Windows firewall integration smoke test
        if: runner.os == 'Windows'
        run: python scripts/smoke_windows_firewall.py
      - run: python build.py
      - name: Portable executable startup
        run: python scripts/smoke_desktop.py --crosshair
      - uses: actions/upload-artifact@v4
        with:
          name: DeadlockToolbox-${{ matrix.os }}
          path: dist/DeadlockToolbox-*-x64.zip
          if-no-files-found: error
  release:
    # Only this explicitly authorized release commit publishes. Ordinary pushes
    # and manual runs build/test without creating or changing releases.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release Deadlock Toolbox v2.2.2'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('artifacts')
          names=['DeadlockToolbox-linux-x64.zip','DeadlockToolbox-windows-x64.zip']
          assert sorted(p.name for p in root.glob('*.zip'))==names
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256((root/n).read_bytes()).hexdigest()+'  '+n+'\n' for n in names))
          PY
      - name: Upload complete draft, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.2.2 --json isDraft > existing-release.json 2>/dev/null; then
            python -c "import json; assert json.load(open('existing-release.json'))['isDraft'], 'Refusing to replace an already published release'"
            gh release edit v2.2.2 --title 'Deadlock Toolbox 2.2.2' --target "$GITHUB_SHA" --notes-file docs/RELEASE_v2.2.2.md
            gh release upload v2.2.2 artifacts/*.zip artifacts/SHA256SUMS.txt --clobber
          else
            gh release create v2.2.2 artifacts/*.zip artifacts/SHA256SUMS.txt --draft --title 'Deadlock Toolbox 2.2.2' --target "$GITHUB_SHA" --notes-file docs/RELEASE_v2.2.2.md
          fi
          gh release view v2.2.2 --json assets > release-assets.json
          python - <<'PY'
          import json
          assets=json.load(open('release-assets.json'))['assets']
          assert {a['name'] for a in assets}=={'DeadlockToolbox-linux-x64.zip','DeadlockToolbox-windows-x64.zip','SHA256SUMS.txt'}
          assert all(a['size']>0 for a in assets)
          PY
          gh release edit v2.2.2 --draft=false --latest
