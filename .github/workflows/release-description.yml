name: Update v2.4.0 release description
on:
  push:
    branches: [main]
    paths: [docs/RELEASE_v2.4.0.md]
permissions:
  contents: write
jobs:
  description:
    if: github.event.head_commit.message == 'Simplify README and v2.4.0 release description'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update description only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit v2.4.0 --notes-file docs/RELEASE_v2.4.0.md
